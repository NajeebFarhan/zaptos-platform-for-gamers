# docker compose up --build   ->   http://localhost:8080
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PRICE_TTL: "1800"
      WARM_DEALS_ON_STARTUP: "1"
    volumes:
      - zaptos-cache:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  zaptos-cache:
